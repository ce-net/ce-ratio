[package]
name = "ce-ratio"
version = "0.1.0"
edition = "2024"
description = "Torrent-style compute share-ratio and reputation over ce-rs. Ranks/orders only — never feeds capability verification."
license = "AGPL-3.0-only"
repository = "https://github.com/ce-net/ce-ratio"
keywords = ["ce", "reputation", "share-ratio", "scheduler", "p2p"]
categories = ["api-bindings"]

[dependencies]
# Cross-repo CE deps are github git deps; tools/ce-dev-link patches them to local WIP.
ce-rs = { git = "https://github.com/ce-net/ce-rs" }
# The trust ceapp reports the money unit (earned/spent) using the economy ceapp's Amount.
ce-economy = { git = "https://github.com/ce-net/economy-adapter" }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
